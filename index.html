<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1F1B16" />
  <title>Cafeku</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1a1510, #2c2318, #1f1b16); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    .box h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -.5px; }
    .box p { font-size: 14px; opacity: .6; margin: 0 0 20px; }
    .box a { display: inline-block; padding: 10px 18px; margin: 4px; border-radius: 10px; text-decoration: none;
      font-size: 14px; font-weight: 600; }
    .box .o { background: #B8752E; color: #fff; }
    .box .k { background: rgba(255,255,255,.12); color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cafeku</h1>
    <p>Sedang perbaikan. Mohon kembali lagi nanti.</p>
    <a class="o" href="./owner/">Buka Owner</a>
    <a class="k" href="./cashier/">Buka Kasir</a>
  </div>
</body>
</html>
